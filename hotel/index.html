<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pajkina hotelová inšpekcia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f1633; --velvet:#221843; --velvet2:#35276a;
  --gold:#ffc53d; --gold2:#e8961c; --paper:#fff6e0; --paper2:#f3e2bb;
  --coral:#ff5d73; --mint:#2fbf8a; --sky:#5bc0eb; --text:#2a2140; --muted:#6d5f86;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; padding-inline:16px; padding-block:12px 24px;
  color:var(--paper);
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif; font-size:16px; line-height:1.4;
  background:
    radial-gradient(circle at 15% -10%, #4a3596 0, transparent 45%),
    radial-gradient(circle at 95% 110%, #5a2366 0, transparent 45%),
    radial-gradient(rgba(255,197,61,.07) 1.2px, transparent 1.3px) 0 0/14px 14px,
    var(--velvet);
  background-attachment:fixed;
}
.app{max-width:1280px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.hud{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.logo{
  margin:0; font-family:Bangers,Impact,"Arial Black",sans-serif; font-weight:400;
  font-size:clamp(28px,4.2vw,44px); letter-spacing:1.5px; line-height:1; color:var(--gold);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 6px 0 #0d0820;
  text-wrap:balance;
}
.where{flex:1 1 200px; font-family:Bangers,Impact,sans-serif; font-size:clamp(18px,2.2vw,24px); letter-spacing:1px; color:var(--paper)}
.where .st{color:var(--gold); letter-spacing:2px}
.hud-btns{display:flex; flex-wrap:wrap; gap:10px}
.btn{
  font-family:Bangers,Impact,sans-serif; font-size:20px; letter-spacing:1px; line-height:1.1;
  color:var(--ink); background:var(--gold); border:3px solid var(--ink); border-radius:12px;
  padding:7px 14px 5px; box-shadow:4px 4px 0 var(--ink); cursor:pointer;
  transition:transform .1s, box-shadow .1s;
}
.btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn.coral{background:var(--coral); color:#fff; text-shadow:1px 1px 0 var(--ink)}
.btn.small{font-size:16px; padding:5px 10px 3px}
.btn:disabled{background:#c9bedb; color:#6d5f86; cursor:not-allowed; transform:none; box-shadow:2px 2px 0 var(--ink); text-shadow:none}
:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
svg :focus-visible{outline:none}
svg .hot:focus-visible{filter:drop-shadow(0 0 5px #5bc0eb) drop-shadow(0 0 2px #5bc0eb)}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start}
@media (max-width:920px){ .layout{grid-template-columns:1fr} }
.panel-stage{position:relative; border:5px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:8px 8px 0 #0d0820; background:#140e2a}
#stage{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none}

.bubble{
  position:absolute; max-width:46%; background:#fff; color:var(--ink);
  border:3px solid var(--ink); border-radius:18px; padding:7px 13px 6px;
  font-weight:700; font-size:clamp(12px,1.55vw,18px); line-height:1.25;
  box-shadow:4px 4px 0 rgba(13,8,32,.55); animation:pop .22s ease-out; pointer-events:none;
}
.bubble::after{content:""; position:absolute; bottom:-15px; width:22px; height:18px; background:#fff; border:3px solid var(--ink); border-top:none; border-left:none; transform:skewX(-35deg); }
.bubble.p{left:1.5%; bottom:43%}
.bubble.p::after{left:28px; border-right:3px solid var(--ink); clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble.b{right:1.5%; bottom:51%; background:#fff8e6}
.bubble.b::after{right:40px; left:auto; transform:skewX(35deg); background:#fff8e6; border-right:none; border-left:3px solid var(--ink); clip-path:polygon(0 0,100% 0,0 100%)}
.bubble .who{display:block; font-family:Bangers,Impact,sans-serif; font-weight:400; letter-spacing:1px; font-size:.85em; color:var(--coral)}
@media (max-width:560px){ .bubble{max-width:62%; padding:5px 9px 4px} .bubble.b{bottom:56%} }

.rooms{display:flex; flex-wrap:wrap; gap:9px; margin-top:14px}
.room-tab{font-family:Bangers,Impact,sans-serif; font-size:19px; letter-spacing:1px; color:var(--ink); background:var(--paper); border:3px solid var(--ink); border-radius:12px; padding:6px 12px 4px; box-shadow:3px 3px 0 #0d0820; cursor:pointer; display:flex; gap:7px; align-items:center}
.room-tab.on{background:var(--gold); transform:translateY(-2px); box-shadow:3px 5px 0 #0d0820}
.room-tab .cnt{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:13px; background:var(--ink); color:var(--paper); border-radius:99px; padding:0 7px; line-height:20px}
.room-tab .new{width:10px; height:10px; border-radius:50%; background:var(--coral); border:2px solid var(--ink)}

.notebook{
  background:repeating-linear-gradient(to bottom, transparent 0 27px, #ead5a8 27px 28px), var(--paper);
  color:var(--text); border:4px solid var(--ink); border-radius:14px; box-shadow:6px 6px 0 #0d0820;
  padding:14px 16px 16px 26px; position:relative; display:flex; flex-direction:column; gap:10px;
}
.notebook::before{content:""; position:absolute; left:12px; top:0; bottom:0; width:2px; background:#ff9aa8}
.notebook h2{font-family:Bangers,Impact,sans-serif; font-weight:400; font-size:30px; letter-spacing:1px; margin:0; color:var(--ink); line-height:1}
.notebook h3{font-family:Bangers,Impact,sans-serif; font-weight:400; font-size:19px; letter-spacing:1px; margin:0; color:var(--ink); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.notebook p{margin:0}
.rule{background:#fff; border:2px dashed var(--ink); border-radius:10px; padding:7px 10px; font-size:14px; line-height:1.35}
.nb-room{display:flex; flex-direction:column; gap:4px; padding:6px 8px; border-radius:10px}
.nb-room.cur{background:rgba(255,197,61,.28); outline:2px solid var(--gold2)}
.nb-room ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px}
.clue{display:flex; gap:7px; align-items:flex-start; font-size:14px; line-height:1.3}
.dot{flex:none; width:19px; height:19px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-size:11px; font-weight:800; color:#fff; margin-top:1px}
.dot.good{background:var(--mint)} .dot.bad{background:var(--coral)} .dot.n{background:var(--sky)}
.muted{color:var(--muted); font-size:14px}
.tag{font-family:"Baloo 2",sans-serif; font-size:12px; font-weight:800; background:var(--ink); color:var(--paper); padding:0 7px; border-radius:99px; letter-spacing:0}
.collection{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.slot{aspect-ratio:1; max-width:100%; background:#fff; border:3px solid var(--ink); border-radius:12px; display:grid; place-items:center; font-family:Bangers,Impact,sans-serif; font-size:24px; color:#c9bedb}
.slot svg{width:90%; height:90%}
.slot.got{background:#fff3c4}
.hlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.hlist li{display:flex; justify-content:space-between; gap:8px; font-size:14px; align-items:baseline}
.hlist b{font-weight:800}
.hlist .sc{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}

.overlay{position:fixed; inset:0; background:rgba(13,8,32,.72); display:grid; place-items:center; padding:16px; z-index:20; overflow:auto}
.card{background:var(--paper); color:var(--text); border:5px solid var(--ink); border-radius:20px; box-shadow:10px 10px 0 #0d0820; width:100%; max-width:720px; padding:20px 22px; animation:pop .25s ease-out; max-height:calc(100dvh - 32px); overflow:auto; display:flex; flex-direction:column; gap:14px}
.card h2{font-family:Bangers,Impact,sans-serif; font-weight:400; font-size:clamp(28px,4vw,42px); letter-spacing:1px; margin:0; color:var(--ink); line-height:1; text-wrap:balance}
.card p{margin:0}
.card .row{display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-end}
.card ol{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:4px}
.intro-top,.bc-top{display:flex; gap:16px; align-items:center}
.intro-top svg{flex:none; width:120px; height:auto}
.bc-top svg{flex:none; width:130px; height:auto; background:radial-gradient(circle at 50% 60%, #fff3c4, #ffd98a); border:3px solid var(--ink); border-radius:16px}
@media (max-width:520px){ .intro-top svg{width:84px} .bc-top svg{width:92px} }
.say{background:#fff; border:3px solid var(--ink); border-radius:14px; padding:9px 13px; font-weight:700}
.asks{display:flex; flex-direction:column; gap:8px}
.ask{font:inherit; font-weight:700; text-align:left; background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:12px; padding:8px 12px; cursor:pointer; box-shadow:3px 3px 0 var(--ink)}
.ask:hover{background:#fff3c4}
.ask.done{background:#efe7d6}
.reply{display:flex; flex-direction:column; gap:8px}
.reply .pj{font-size:14px; color:var(--muted)}
.rv-list{display:flex; flex-direction:column; gap:6px}
.rv-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 10px; background:#fff; border:2px solid var(--ink); border-radius:12px}
.rv-row span{font-weight:800}
.stars{display:flex; gap:2px}
.stars button{font-size:30px; line-height:1; background:none; border:none; padding:0 2px; cursor:pointer; color:#e3d6b6; -webkit-text-stroke:2px var(--ink)}
.stars button.on{color:var(--gold)}
.stars button:hover{transform:scale(1.15)}
.res-table{width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums}
.res-table th,.res-table td{padding:6px 8px; border-bottom:2px solid var(--paper2); text-align:left}
.res-table th{font-family:Bangers,Impact,sans-serif; font-weight:400; letter-spacing:1px; font-size:17px}
.res-table td.num{text-align:right; font-weight:800}
.res-table .st{color:var(--gold2); letter-spacing:1px; white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.thumb{width:100%; height:auto; border:4px solid var(--ink); border-radius:14px; display:block}
.comments{display:flex; flex-direction:column; gap:6px}
.comment{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; font-size:14px}
.comment b{color:var(--coral)}

@keyframes pop{from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1}}
.hot{cursor:pointer; transform-box:fill-box; transform-origin:50% 100%; transition:transform .15s, filter .15s}
.hot:hover{transform:scale(1.05); filter:drop-shadow(0 0 6px #ffe27a) drop-shadow(0 0 2px #ffe27a)}
.pin:hover{transform:scale(1.08) translateY(-4px)}
.buzz{animation:buzz 1.8s linear infinite}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(16px,-10px)}50%{transform:translate(2px,-18px)}75%{transform:translate(-16px,-7px)}100%{transform:translate(0,0)}}
.wing{animation:wing .12s linear infinite; transform-box:fill-box; transform-origin:50% 100%}
@keyframes wing{50%{transform:scaleY(.4)}}
.twinkle{animation:tw 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.twinkle.d2{animation-delay:.5s} .twinkle.d3{animation-delay:1s}
@keyframes tw{0%,100%{transform:scale(.3); opacity:.2}50%{transform:scale(1); opacity:1}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{animation:blink 4.5s infinite; transform-box:fill-box; transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.flick{animation:flick .9s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 100%}
@keyframes flick{to{transform:scale(.85,1.1)}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
.defs{position:absolute; width:0; height:0; overflow:hidden}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffc53d"/><stop offset="1" stop-color="#d98a12"/></linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd6e3"/><stop offset="1" stop-color="#8f9ab0"/></linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f0ff"/><stop offset=".55" stop-color="#9fb2d4"/><stop offset="1" stop-color="#6d7fa6"/></linearGradient>
    <linearGradient id="gSkyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cb8f0"/><stop offset="1" stop-color="#d4f1ff"/></linearGradient>
    <linearGradient id="gSkySunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset=".6" stop-color="#ffc58a"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
    <linearGradient id="gSkyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2a73"/><stop offset=".6" stop-color="#8c4f9c"/><stop offset="1" stop-color="#ff9f6b"/></linearGradient>
    <linearGradient id="gSkyDesert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a55"/><stop offset="1" stop-color="#ffe6a3"/></linearGradient>
    <linearGradient id="gSkyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b2e"/><stop offset="1" stop-color="#27316e"/></linearGradient>
    <linearGradient id="gAurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3cffb0" stop-opacity=".1"/><stop offset=".4" stop-color="#3cffb0" stop-opacity=".85"/><stop offset=".7" stop-color="#7ee8ff" stop-opacity=".7"/><stop offset="1" stop-color="#c77dff" stop-opacity=".2"/></linearGradient>
    <linearGradient id="gAurora2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c77dff" stop-opacity=".1"/><stop offset=".5" stop-color="#ff7ad9" stop-opacity=".6"/><stop offset="1" stop-color="#3cffb0" stop-opacity=".1"/></linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8be6ff"/><stop offset="1" stop-color="#1f8fd6"/></linearGradient>
    <linearGradient id="gMurk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8c24a"/><stop offset="1" stop-color="#4d6f22"/></linearGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55c3ec"/><stop offset="1" stop-color="#2a7fc4"/></linearGradient>
    <linearGradient id="gFloorShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".35" stop-color="#000" stop-opacity="0"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fff7c0" stop-opacity=".9"/><stop offset=".4" stop-color="#ffe27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gVig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#140a2a" stop-opacity=".45"/></radialGradient>
    <radialGradient id="gRays" cx=".2" cy=".6" r="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb13d"/></radialGradient>
    <pattern id="pDots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.4" fill="#1f1633" fill-opacity=".13"/></pattern>
  </defs>
</svg>

<div class="app">
  <header class="hud">
    <h1 class="logo">Pajkina hotelová inšpekcia</h1>
    <div class="where" id="where"></div>
    <div class="hud-btns">
      <button class="btn alt" id="bMap" type="button" hidden>Mapa</button>
      <button class="btn" id="bButler" type="button" hidden>Zavolať komorníka</button>
      <button class="btn alt" id="bSound" type="button" aria-pressed="true">Zvuk: áno</button>
      <button class="btn alt" id="bHelp" type="button">Ako hrať</button>
    </div>
  </header>
  <main class="layout">
    <section>
      <div class="panel-stage">
        <svg id="stage" viewBox="0 0 1000 600" role="img" aria-label="Herná scéna"></svg>
        <div id="bubP" class="bubble p" hidden></div>
        <div id="bubB" class="bubble b" hidden></div>
      </div>
      <nav class="rooms" id="rooms" aria-label="Miestnosti hotela"></nav>
    </section>
    <aside class="notebook" id="nb" aria-live="polite"></aside>
  </main>
</div>
<div class="overlay" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
"use strict";
const INK = "#1f1633";
const O  = `stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const O3 = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const O2 = `stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const NS = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"`;
const FONT = `font-family="Bangers, Impact, sans-serif"`;
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n => "★".repeat(n) + "☆".repeat(Math.max(0,5-n));
const outlined = (d, col, w) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+6}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function seeded(i){ const x = Math.sin(i*127.1+311.7)*43758.5453; return x - Math.floor(x); }

/* ================= VÝHĽADY ================= */
function view(kind){
  if(kind === "mountains") return `
    <rect x="-20" y="-20" width="140" height="140" fill="url(#gSkyDay)"/>
    <circle cx="80" cy="36" r="6" fill="#ffe066" ${NS}/>
    <path d="M-20 70 L20 38 L34 52 L52 32 L72 54 L84 44 L120 70 V120 H-20Z" fill="#8193bd" ${NS}/>
    <path d="M20 38 L15 44 L20 42.5 L25 45Z M52 32 L46.5 38.5 L52 37 L57.5 39.5Z M84 44 L80.5 48 L84 47 L87.5 48.5Z" fill="#fff" ${NS}/>
    <path d="M-20 72 Q30 62 60 70 Q85 76 120 68 V120 H-20Z" fill="#62b861" ${NS}/>
    <path d="M10 64 L6 71 H14Z M16 62 L12 70 H20Z M70 66 L66 73 H74Z" fill="#2f7a45" ${NS}/>
    <path d="M-20 84 Q50 78 120 86 V120 H-20Z" fill="#4c9e50"/>`;
  if(kind === "sea") return `
    <rect x="-20" y="-20" width="140" height="140" fill="url(#gSkySunset)"/>
    <circle cx="52" cy="56" r="10" fill="#ffd166" ${NS}/>
    <path d="M70 58 Q78 49 90 58Z" fill="#3d8f5f" ${NS}/>
    <path d="M-20 58 H120 V120 H-20Z" fill="#2c8fd6" ${NS}/>
    <path d="M40 62 H64 M44 66 H60" stroke="#ffd166" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    <path d="M5 70 q4 -2 8 0 M25 78 q4 -2 8 0 M66 72 q4 -2 8 0 M80 82 q4 -2 8 0" fill="none" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    <path d="M18 59 H32 L29 63 H21Z" fill="#fff" ${NS}/><path d="M25 58 V45 L33 57Z" fill="#ff5d73" ${NS}/>`;
  if(kind === "city") {
    let w = "";
    const bs = [[-6,46,14,26],[8,36,11,36],[30,44,22,28],[54,30,8,42],[64,50,10,22],[88,40,14,32]];
    bs.forEach(([x,y,wd,h],i) => {
      w += `<rect x="${x}" y="${y}" width="${wd}" height="${h}" fill="#3a2f6a" ${NS}/>`;
      for(let r=y+4; r<y+h-4; r+=6) for(let c=x+2; c<x+wd-2; c+=4)
        if(seeded(i*50+r*3+c) > .45) w += `<rect x="${c}" y="${r}" width="2" height="3" fill="#ffd96b"/>`;
    });
    return `
    <rect x="-20" y="-20" width="140" height="140" fill="url(#gSkyDusk)"/>
    <circle cx="16" cy="30" r="4" fill="#fff4c2"/>
    <circle cx="80" cy="50" r="14" fill="none" ${NS}/>
    <path d="M80 36 V64 M66 50 H94 M70 40 L90 60 M90 40 L70 60" stroke="${INK}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    ${w}
    <path d="M30 44 Q41 30 52 44Z" fill="#6b4fb0" ${NS}/><path d="M41 32 V26" stroke="${INK}" stroke-width="2" vector-effect="non-scaling-stroke"/>

function perspFloor(t, mode){
  const VP = -300, f = y => (y - VP) / (420 - VP);
  const rows = [420, 446, 478, 518, 566, 620];
  let s = "";
  if(mode === "wood"){
    let lines = "";
    for(let u=-400; u<=1400; u+=70) lines += `M${u} 420 L${(500+(u-500)*f(620)).toFixed(1)} 620 `;
    s += `<path d="${lines}" stroke="${t.floor2}" stroke-width="3"/>`;
    rows.slice(1,-1).forEach((y,ri) => {
      let j = "";
      for(let u=-400+(ri%2)*35; u<=1400; u+=140){ const x = 500+(u-500)*f(y); j += `M${x.toFixed(1)} ${y} l0 ${(rows[ri+2]-y)*.001}`; j += `M${x.toFixed(1)} ${y-12} V${y+12} `; }
      s += `<path d="${j}" stroke="${t.floor2}" stroke-width="3"/>`;
    });
    return s;
  }
  const step = mode === "checker" ? 100 : 80;
  for(let r=0; r<rows.length-1; r++){
    for(let u=-500, c=0; u<=1500; u+=step, c++){
      const y0 = rows[r], y1 = rows[r+1];
      const x00 = 500+(u-500)*f(y0), x01 = 500+(u+step-500)*f(y0), x10 = 500+(u-500)*f(y1), x11 = 500+(u+step-500)*f(y1);
      const alt = (r + c) % 2 === 0;
      const fill = mode === "tiles" ? (alt ? t.floor : t.floor2) : (alt ? t.floor : t.floor2);
      s += `<path d="M${x00.toFixed(1)} ${y0} L${x01.toFixed(1)} ${y0} L${x11.toFixed(1)} ${y1} L${x10.toFixed(1)} ${y1}Z" fill="${fill}" stroke="${mode==="marble"?"#c9a227":INK}" stroke-width="${mode==="marble"?2:1.2}" stroke-opacity="${mode==="marble"?1:.35}"/>`;
    }
  }
  return s;
}
function wallPattern(t){

  }

  if(t.pattern === "damask"){

  }
  return s;
}

let AC = null;
function ac(){ if(!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } } return AC; }
function tone(f, d=.15, type="sine", vol=.12, delay=0, f2){
  if(!soundOn) return; const a = ac(); if(!a) return;
  try {
    const t0 = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch(e){}
}

    s += `<rect x="${-w/2-18}" y="${-bh+10}" width="20" height="${bh-10}" fill="${c}" ${O3}/><rect x="${w/2-2}" y="${-bh+10}" width="20" height="${bh-10}" fill="${c}" ${O3}/>

  }

  for(let r=0; r<n; r++) for(let k=0; k<3; k++){
    const x = -w/2 + 10 + k*((w-20)/3) + 2, y = -bh + 8 + r*14;

  if(h.map.roof === "grand") s += `<path d="M-22 ${top} Q-22 ${top-34} 0 ${top-34} Q22 ${top-34} 22 ${top}Z" fill="url(#gGold)" ${O3}/><path d="M0 ${top-34} V${top-48}" ${O3}/><path d="M0 ${top-48} l14 5 l-14 5Z" fill="#ff5d73" ${O2}/>`;
  if(h.map.roof === "oasis") s += `<path d="M-24 ${top} Q-26 ${top-20} 0 ${top-40} Q26 ${top-20} 24 ${top}Z" fill="#1e9fbf" ${O3}/><circle cx="0" cy="${top-44}" r="4" fill="url(#gGold)" ${O2}/>`;
  if(h.map.roof === "palace") s += `<path d="M-26 ${top} Q-28 ${top-24} 0 ${top-48} Q28 ${top-24} 26 ${top}Z" fill="#7c4ddb" ${O3}/><path d="M0 ${top-48} V${top-62}" ${O3}/>${SPARK(0,top-70,9)}`;
  return s;

/* ================= MIESTNOSŤ ================= */
function roomSVG(){
  const h = S.h, t = h.theme, r = h.rooms[S.room];
  let s = roomBg(r.type, t);
  s += `<rect width="1000" height="600" fill="url(#pDots)" pointer-events="none"/>`;
  r.objects.forEach((o,i) => {
    const id = S.room + "-" + i;
    s += `<g id="w${id}" transform="translate(${o.x} ${o.y}) scale(${o.s||1})"><g class="hot" data-act="obj" data-id="${id}" tabindex="0" role="button" aria-label="Preskúmať: ${LABEL[o.k]}">${K[o.k](o.v, t, o)}</g></g>`;
  });
  if(h.secret.room === S.room && !S.secret){
    const q = h.secret;
    s += `<g transform="translate(${q.x} ${q.y}) scale(${q.s})"><g class="hot" data-act="secret" tabindex="0" role="button" aria-label="Niečo sa tu leskne">${treasure(q.kind)}</g></g>`;
  }
  s += `<g transform="translate(95 588)"><g class="hot" data-act="pajka" tabindex="0" role="button" aria-label="Pajka"><g id="pajkaG">${drawPajka(S.mood)}</g></g></g>`;
  if(h.butler) s += `<g transform="translate(905 588) scale(.95)"><g class="hot" data-act="butler" tabindex="0" role="button" aria-label="Komorník ${esc(h.butler.name)}"><g class="bob">${drawButler(h.butler.look)}</g></g></g>`;
  s += `<rect width="1000" height="600" fill="url(#gVig)" pointer-events="none"/>`;
  return s;
}
function addBadges(){
  S.found.forEach(id => {
    if(!id.startsWith(S.room + "-")) return;
    const w = document.getElementById("w" + id); if(!w) return;
    const hot = w.firstElementChild; let x0=Infinity, y0=Infinity, x1=-Infinity;
    [...hot.children].forEach(c => { if(c.classList.contains("fx")) return; try { const b = c.getBBox(); if(b.width || b.height){ x0 = Math.min(x0,b.x); y0 = Math.min(y0,b.y); x1 = Math.max(x1,b.x+b.width); } } catch(e){} });
    if(!isFinite(x0)) return;
    const o = objOf(id), col = o.v === "bad" ? "#ff5d73" : o.v === "good" ? "#2fbf8a" : "#5bc0eb", sym = o.v === "bad" ? "!" : o.v === "good" ? "✓" : "i";
    const sc = 1 / (o.s || 1);
    w.insertAdjacentHTML("beforeend", `<g transform="translate(${x1-4} ${Math.max(y0+4, 20)}) scale(${sc})" pointer-events="none"><circle r="15" fill="${col}" ${O3}/><text y="7" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="20" fill="#fff">${sym}</text></g>`);
  });
}
const objOf = id => { const [ri,oi] = id.split("-").map(Number); return S.h.rooms[ri].objects[oi]; };

/* ================= ZÁPISNÍK ================= */
function clueText(o){ return o.k === "dish" ? `${o.name}: ${o.v === "good" ? "výborné" : "zlé"}` : SHORT[o.k][o.v]; }
function notebookHotel(){
  const h = S.h;
  let html = `<h2>Zápisník</h2>
    <p class="rule"><b>Štandard hodnotenia:</b> každá časť hotela začína na 5★. Každá chyba −1★, vážna chyba −2★. Pri komorníkovi rovnako: každá jeho chyba −1★.</p>`;
  h.rooms.forEach((r,ri) => {
    const clues = r.objects.map((o,oi) => [o, ri+"-"+oi]).filter(([,id]) => S.found.has(id));
    html += `<div class="nb-room${ri===S.room?" cur":""}"><h3>${TYPES[r.type]}${S.visited.has(ri) ? "" : ` <span class="tag">ešte nie</span>`}</h3>
      ${clues.length ? `<ul>${clues.map(([o]) => `<li class="clue"><span class="dot ${o.v}">${o.v==="bad"?"!":o.v==="good"?"✓":"i"}</span><span>${esc(clueText(o))}</span></li>`).join("")}</ul>` : `<p class="muted">Zatiaľ nič nenájdené.</p>`}</div>`;
  });
  if(h.butler){
    const asked = h.butler.asks.filter((a,i) => S.asked.has(i));
    html += `<div class="nb-room"><h3>Komorník ${esc(h.butler.name)}</h3>
      ${asked.length ? `<ul>${asked.map(a => `<li class="clue"><span class="dot ${a.good?"good":"bad"}">${a.good?"✓":"!"}</span><span>${esc(a.pj)}</span></li>`).join("")}</ul>` : `<p class="muted">Ešte sme sa nerozprávali. Klikni na komorníka.</p>`}</div>`;
  } else html += `<div class="nb-room"><h3>Komorník</h3><p class="muted">Tento hotel nemá komorníka.</p></div>`;
  html += `<div class="nb-room"><h3>Skrytý poklad</h3><p>${S.secret ? `<b>${TREASURE[h.secret.kind]}</b> je v mojej zbierke!` : `<span class="muted">Niekde sa tu niečo leskne…</span>`}</p></div>`;
  const left = h.rooms.length - S.visited.size;
  html += `<button class="btn coral" id="bReview" type="button" ${left ? "disabled" : ""}>Napísať recenziu</button>`;
  if(left) html += `<p class="muted">Najprv navštív všetky miestnosti (zostáva ${left}).</p>`;
  return html;
}

  const got = HOTELS.filter(h => P.hotels[h.id] && P.hotels[h.id].secret);
  let html = `<h2>Pajkin denník</h2>
    <p>Som hotelová recenzentka. Vyber hotel na mape, preskúmaj ho a napíš presnú recenziu.</p>
    <h3>Zbierka pokladov (${got.length}/5)</h3>

/* ================= RENDER ================= */
const stage = $("#stage");
function render(){
  const inHotel = S.screen === "hotel";
  $("#bMap").hidden = !inHotel;
  $("#bButler").hidden = !(inHotel && S.h.butler);
  if(!inHotel){
    stage.innerHTML = mapSVG();
    stage.setAttribute("aria-label", "Mapa hotelov");
    $("#where").innerHTML = "Kam dnes vyrazíme?";
    $("#rooms").innerHTML = "";
    $("#nb").innerHTML = notebookMap();
    return;
  }
  const h = S.h;
  stage.innerHTML = roomSVG();
  stage.setAttribute("aria-label", `${h.name}, ${TYPES[h.rooms[S.room].type]}`);
  addBadges();
  $("#where").innerHTML = `${esc(h.name)} <span class="st">${"★".repeat(h.official)}</span>`;
  $("#rooms").innerHTML = h.rooms.map((r,i) => {
    const cnt = r.objects.filter((o,oi) => S.found.has(i+"-"+oi)).length;
    return `<button type="button" class="room-tab${i===S.room?" on":""}" data-room="${i}" aria-current="${i===S.room}">${TYPES[r.type]}${S.visited.has(i) ? (cnt ? `<span class="cnt">${cnt}</span>` : "") : `<span class="new" aria-label="nenavštívené"></span>`}</button>`;
  }).join("");
  $("#nb").innerHTML = notebookHotel();
}

function goMap(){
  S = {screen:"map", mood:"happy"}; hideBubbles(); render();
  say("Kam pôjdeme dnes? Vyber hotel na mape!", "happy");
}
function openHotel(id){
  const h = HOTELS.find(x => x.id === id); if(!h) return;
  SFX.good();
  S = {screen:"hotel", h, room:0, found:new Set(), visited:new Set([0]), asked:new Set(), secret:false, mood:"wow", rating:{}};
  hideBubbles(); render();
  say(h.welcome, "wow");
  if(h.butler) setTimeout(() => { if(S.h === h) sayB(h.butler.hello); }, 900);
}
function enterRoom(i){
  if(i === S.room) return;
  SFX.click(); S.room = i; const first = !S.visited.has(i); S.visited.add(i); S.mood = "happy"; render();
  hideBubbles();
  if(first) say(`${TYPES[S.h.rooms[i].type]}! Poďme sa poriadne pozrieť.`, "think");
}
function inspect(id){
  const o = objOf(id);
  const note = o.note || NOTES[o.k][o.v];
  S.found.add(id);
  S.mood = o.v === "bad" ? "yuck" : o.v === "good" ? "happy" : "wow";
  if(o.k === "bell") (o.v === "good" ? SFX.ding : SFX.bad)();
  else (o.v === "bad" ? SFX.bad : o.v === "good" ? SFX.good : SFX.n)();
  render(); say(note);
}
function takeSecret(){
  S.secret = true; SFX.secret();
  const name = TREASURE[S.h.secret.kind];
  S.mood = "wow"; render();
  say(`Juchú! Našla som poklad: ${name}!`);
}

function askButler(k){
  const b = S.h.butler;
  if(k === "hint"){ SFX.n(); butlerModal("hint"); return; }
  const i = Number(k), a = b.asks[i];
  S.asked.add(i); (a.good ? SFX.good : SFX.bad)();
  S.mood = a.good ? "happy" : "yuck";
  render(); butlerModal(i);
}

  if(h.butler) c.push({key:"b", label:"Komorník " + h.butler.name, truth:butlerTruth(h.butler)});

}

function resultsModal(){
  const h = S.h, cats = categories();
  const PTS = [100,60,25,0,0];
  const rows = cats.map(c => { const mine = S.rating[c.key], d = Math.abs(mine - c.truth); return {...c, mine, pts:PTS[d]}; });
  const acc = Math.round(rows.reduce((a,r) => a + r.pts, 0) / rows.length);
  const prev = P.hotels[h.id];
  P.hotels[h.id] = {best: Math.max(acc, prev ? prev.best : 0), secret: S.secret || !!(prev && prev.secret)};
  save();
  const rank = acc >= 90 ? "Legendárna inšpektorka" : acc >= 70 ? "Hotelová detektívka" : acc >= 50 ? "Šikovná recenzentka" : "Začínajúca turistka";
  const mood = acc >= 70 ? "happy" : acc >= 50 ? "think" : "yuck";
  const comments = acc >= 90
    ? [["hotelovy_fan","Presne tak to tam vyzerá, bola som tam minulý týždeň!"],["babka_zuzka","Pajka, ty si najlepšia recenzentka na svete!"]]
    : acc >= 60 ? [["cestovatel99","Dobrá recenzia, ale niečo si prehliadla."],["mama_na_cestach","Vďaka, podľa teba si budeme vyberať dovolenku!"]]
    : [["skeptik_jano","Hmm, toto hodnotenie mi nesedí…"],["recepcna_eva","Skús sa ešte raz poriadne pozrieť, Pajka!"]];
  acc >= 70 ? SFX.fanfare() : SFX.n();
  openModal(`<svg class="thumb" viewBox="0 0 800 300" role="img" aria-label="Náhľad videa s recenziou">
      <rect width="800" height="300" fill="url(#gRays)"/>
      ${Array.from({length:14},(_,i) => { const a = i*Math.PI/7; return `<path d="M160 190 L${160+900*Math.cos(a)} ${190+900*Math.sin(a)} L${160+900*Math.cos(a+.12)} ${190+900*Math.sin(a+.12)}Z" fill="#fff" opacity=".22"/>`; }).join("")}
      <g transform="translate(150 300) scale(1.1)">${drawPajka(mood)}</g>
      <text x="520" y="80" text-anchor="middle" ${FONT} font-size="58" fill="#ff5d73" stroke="${INK}" stroke-width="3" paint-order="stroke" letter-spacing="2">MOJA RECENZIA!</text>
      <text x="520" y="130" text-anchor="middle" ${FONT} font-size="${h.name.length > 16 ? 34 : 40}" fill="#fff" stroke="${INK}" stroke-width="3" paint-order="stroke" letter-spacing="1">${esc(h.name.toUpperCase())}</text>
      <g transform="translate(520 212)"><circle r="62" fill="${acc>=70?"#2fbf8a":"#ff5d73"}" ${O}/><text y="12" text-anchor="middle" ${FONT} font-size="44" fill="#fff" stroke="${INK}" stroke-width="2" paint-order="stroke">${acc}%</text><text y="40" text-anchor="middle" ${FONT} font-size="15" fill="#fff">PRESNOSŤ</text></g>
      ${S.secret ? `<g transform="translate(680 220)">${treasure(h.secret.kind,false)}</g>` : ""}
    </svg>
    <h2>${rank}</h2>
    <div class="tbl-wrap"><table class="res-table"><thead><tr><th>Časť hotela</th><th>Ty</th><th>Štandard</th><th style="text-align:right">Body</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.label)}</td><td class="st">${stars(r.mine)}</td><td class="st">${stars(r.truth)}</td><td class="num">${r.pts}</td></tr>`).join("")}</tbody></table></div>
    <p>${S.secret ? `Poklad nájdený: <b>${TREASURE[h.secret.kind]}</b>.` : `Skrytý poklad si tentoraz nenašla. Skús to znova!`} Oficiálne má hotel ${h.official}★, ale dôležité je, čo si naozaj videla.</p>
    <div class="comments"><h3 style="font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:1px;margin:0">Komentáre fanúšikov</h3>${comments.map(([u,t]) => `<div class="comment"><b>@${u}</b> ${esc(t)}</div>`).join("")}</div>
    <div class="row"><button class="btn alt" type="button" id="bAgain">Znova tento hotel</button><button class="btn coral" type="button" id="bToMap">Späť na mapu</button></div>`, "Výsledok recenzie");
}

/* ================= UDALOSTI ================= */
function act(t){
  const a = t.dataset.act;
  if(a === "hotel") openHotel(t.dataset.id);
  else if(a === "obj") inspect(t.dataset.id);
  else if(a === "secret") takeSecret();
  else if(a === "butler"){ SFX.ding(); butlerModal(); }
  else if(a === "pajka") (S.screen === "hotel" ? pajkaTip() : say("Vyber hotel, kam pôjdeme!", "happy"));
}
stage.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if(t) act(t); });
stage.addEventListener("keydown", e => { if(e.key !== "Enter" && e.key !== " ") return; const t = e.target.closest("[data-act]"); if(t){ e.preventDefault(); act(t); } });
$("#rooms").addEventListener("click", e => { const b = e.target.closest("[data-room]"); if(b) enterRoom(Number(b.dataset.room)); });
$("#nb").addEventListener("click", e => {
  if(e.target.closest("#bReview")){ SFX.click(); reviewModal(); }
  const r = e.target.closest("#bReset");
  if(r){
    if(r.dataset.armed){ P = {hotels:{}, seenIntro:true, sound:soundOn}; save(); render(); say("Všetko je vymazané. Začíname odznova!", "wow"); }
    else { r.dataset.armed = "1"; r.textContent = "Naozaj? Klikni ešte raz"; }
  }
});
card.addEventListener("click", e => {
  if(e.target.closest("[data-close]")){ SFX.click(); closeModal(); return; }
  const ask = e.target.closest("[data-ask]"); if(ask){ askButler(ask.dataset.ask); return; }
  const st = e.target.closest("[data-cat]");
  if(st){
    S.rating[st.dataset.cat] = Number(st.dataset.n); SFX.click();
    st.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.n) <= S.rating[st.dataset.cat]));
    $("#bSubmit").disabled = !categories().every(c => S.rating[c.key]);
    return;
  }
  if(e.target.closest("#bSubmit")){ resultsModal(); render(); return; }
  if(e.target.closest("#bAgain")){ const id = S.h.id; closeModal(); openHotel(id); return; }
  if(e.target.closest("#bToMap")){ closeModal(); goMap(); }
});
$("#bMap").addEventListener("click", () => { SFX.click(); goMap(); });
$("#bButler").addEventListener("click", () => { SFX.ding(); butlerModal(); });
$("#bHelp").addEventListener("click", () => { SFX.click(); openHelp(); });
const sb = $("#bSound");
function syncSound(){ sb.textContent = soundOn ? "Zvuk: áno" : "Zvuk: nie"; sb.setAttribute("aria-pressed", String(soundOn)); }
sb.addEventListener("click", () => { soundOn = !soundOn; P.sound = soundOn; save(); syncSound(); SFX.click(); });
syncSound();

goMap();
if(!P.seenIntro) openHelp();
})();
</script>
</body>
</html>
